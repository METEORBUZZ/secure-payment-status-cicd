apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/alert-rules.yaml

    scrape_configs:
      - job_name: "prometheus"
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: "payment-status-dev"
        metrics_path: /metrics
        static_configs:
          - targets: ["payment-status-dev.dev.svc.cluster.local:8000"]
            labels:
              environment: "dev"

      - job_name: "payment-status-staging"
        metrics_path: /metrics
        static_configs:
          - targets: ["payment-status-staging.staging.svc.cluster.local:8000"]
            labels:
              environment: "staging"

  alert-rules.yaml: |
    groups:
      - name: payment-status-alerts
        rules:
          - alert: HighErrorRate
            expr: |
              (
                sum(rate(http_requests_total{status_code=~"5.."}[5m]))
                /
                sum(rate(http_requests_total[5m]))
              ) * 100 > 5
            for: 2m
            labels:
              severity: critical
              service: payment-status-service
            annotations:
              summary: "High HTTP 5xx error rate detected on payment-status-service"
              description: "HTTP 5xx error rate is currently at {{ $value | printf \"%.2f\" }}% (> 5% threshold)."

          - alert: HighRequestLatency
            expr: |
              histogram_quantile(
                0.95,
                sum(rate(http_request_duration_seconds_bucket[5m])) by (le)
              ) > 0.5
            for: 2m
            labels:
              severity: warning
              service: payment-status-service
            annotations:
              summary: "Elevated p95 request latency detected on payment-status-service"
              description: "95th percentile latency is {{ $value | printf \"%.3f\" }}s (> 500ms threshold)."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config-volume
              mountPath: /etc/prometheus
            - name: storage-volume
              mountPath: /prometheus
      volumes:
        - name: config-volume
          configMap:
            name: prometheus-config
        - name: storage-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  type: ClusterIP
  ports:
    - port: 9090
      targetPort: 9090
      name: http
  selector:
    app: prometheus
