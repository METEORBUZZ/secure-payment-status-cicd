apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "payment-status.fullname" . }}
  labels:
    {{- include "payment-status.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "payment-status.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "payment-status.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "payment-status.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "payment-status.fullname" . }}-config
            - secretRef:
                name: {{ include "payment-status.fullname" . }}-secret
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data-volume
              mountPath: /data
            - name: tmp-volume
              mountPath: /tmp
            - name: shm-volume
              mountPath: /dev/shm
      volumes:
        - name: data-volume
          emptyDir: {}
        - name: tmp-volume
          emptyDir: {}
        - name: shm-volume
          emptyDir:
            medium: Memory
