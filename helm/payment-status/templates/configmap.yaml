apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "payment-status.fullname" . }}-config
  labels:
    {{- include "payment-status.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.env.APP_ENV | quote }}
  LOG_LEVEL: {{ .Values.env.LOG_LEVEL | quote }}
  PORT: {{ .Values.env.PORT | quote }}
  DB_PATH: {{ .Values.env.DB_PATH | quote }}
  DEBUG: {{ .Values.env.DEBUG | quote }}
